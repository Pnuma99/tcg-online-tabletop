<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TCG Online v0.6</title><link rel="stylesheet" href="/style.css"></head><body><header><h1>TCG Online <small>v0.6</small></h1><span id="status">Offline</span></header><section id="lobby"><h2>Spielraum</h2><input id="code" placeholder="Raumcode (leer = erstellen)" maxlength="6"><button id="join">Erstellen / beitreten</button></section><main id="game" hidden><section class="toolbar"><strong id="room"></strong><span id="turn"></span><button id="end">Zug beenden</button></section><section id="enemy" class="board"></section><div class="divider">GEGNER ↑ &nbsp; | &nbsp; DU ↓</div><section id="self" class="board"></section><section class="toolbar"><span id="energy"></span><span id="playerCounters"></span><button id="energyMinus">− Energie</button><button id="energyPlus">+ Energie</button><button id="setEnergy">Energie setzen</button><button id="setMaxEnergy">Max setzen</button><button id="roll20">🎲 W20</button></section><section class="tools"><h3>Import & Kartenverwaltung</h3><label>Bilddateien <input type="file" id="files" accept="image/png,image/jpeg,image/webp" multiple></label><select id="cardType"><option value="action">Magiekarten (Deck)</option><option value="hero">Charakterkarten (offener Stapel)</option></select><label>Angriff <input type="number" id="attack" value="5" min="0" max="99"></label><label>Leben <input type="number" id="hp" value="15" min="1" max="99"></label><button id="shuffle">Deck mischen</button><button id="draw">Karte ziehen</button><button id="recycle">Ablage ins Deck mischen</button><button id="cleanup" class="danger">Spielfeld aufräumen</button><span id="piles"></span></section><div class="piles"><section><h3>Charakterstapel <small>(offen)</small></h3><div id="heroPool" class="hand"></div></section><section><h3>Deine Hand <small>(verdeckt für Gegner)</small></h3><div id="hand" class="hand"></div></section><section><h3>Ablagestapel <small>(antippen zum Durchsuchen)</small></h3><button id="browseDiscard">Ablage durchsuchen</button><div id="discardPreview" class="hand"></div></section></div><h3>Spielprotokoll</h3><div id="log"></div></main><dialog id="cardDialog"><div id="details"></div><div id="actions"></div><button id="close">Schließen</button></dialog><div id="toast"></div><script src="/app.js"></script></body></html>
