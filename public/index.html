<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TCG Online – iPhone Sandbox</title><link rel="stylesheet" href="/style.css"></head><body><header><h1>TCG Online <small>v0.4 · iPhone</small></h1><span id="status">Offline</span></header><section id="lobby"><h2>Privater Spielraum</h2><input id="code" placeholder="Raumcode (leer = erstellen)" maxlength="6"><button id="join">Raum erstellen / beitreten</button><p>Teile den Code mit deinem Mitspieler. Beide öffnen dieselbe Serveradresse.</p></section><main id="game" hidden><section class="toolbar"><strong id="room"></strong><span id="turn"></span><button id="end">Zug beenden</button></section><section id="enemy" class="board"></section><div class="divider">GEGNER ↑ &nbsp; | &nbsp; DU ↓</div><section id="self" class="board"></section><section class="toolbar"><div id="energy"></div><button id="energyMinus">− Energie</button><button id="energyPlus">+ Energie</button><button id="maxPlus">+ Max</button><button id="setEnergy">Energie setzen</button><button id="setMaxEnergy">Maximum setzen</button><button id="roll20">🎲 W20</button><button id="rollCustom">🎲 Anderer Würfel</button><button id="playerCounter">Eigener Counter</button><span id="playerCounters"></span></section><section class="tools"><h3>Deine Karten</h3><label>Kartenbilder importieren <input type="file" id="files" accept="image/png,image/jpeg,image/webp" multiple></label><select id="cardType"><option value="action">Fähigkeits-/Magiekarte</option><option value="hero">Heldenkarte</option></select><label>Angriff <input type="number" id="attack" value="5" min="0" max="99"></label><label>Leben <input type="number" id="hp" value="15" min="1" max="99"></label><button id="shuffle">Deck mischen</button><button id="draw">Karte ziehen</button><span id="piles"></span></section><h3>Deine Hand <small>(nur für dich sichtbar)</small></h3><section id="hand" class="hand"></section><h3>Spielprotokoll</h3><div id="log"></div></main><dialog id="cardDialog"><div id="details"></div><div id="actions"></div><button id="close">Schließen</button></dialog><div id="toast"></div><script src="/app.js"></script></body></html>
